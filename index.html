<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Реалистичные 3D кубики с вращением и полетом</title>
<style>
  body {
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    font-family: Arial, sans-serif;
    color: #fff;
  }
  .balance {
    font-size: 1.5em;
    margin-bottom: 20px;
    text-shadow: 1px 1px 2px #000;
  }
  .dice-container {
    display: flex;
    gap: 20px;
    margin-bottom: 20px;
  }
  .scene {
    width: 100px;
    height: 100px;
    perspective: 1500px;
  }
  .cube {
    width: 100px;
    height: 100px;
    position: relative;
    transform-style: preserve-3d;
  }
  .face {
    position: absolute;
    width: 100px;
    height: 100px;
    background: #fff;
    border: 2px solid #555;
    border-radius: 8px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 1.5em;
    font-weight: bold;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
  }
  .front  { transform: rotateY(0deg) translateZ(50px); }
  .back   { transform: rotateY(180deg) translateZ(50px); }
  .right  { transform: rotateY(90deg) translateZ(50px); }
  .left   { transform: rotateY(-90deg) translateZ(50px); }
  .top    { transform: rotateX(90deg) translateZ(50px); }
  .bottom { transform: rotateX(-90deg) translateZ(50px); }

  @keyframes flyAndRotate {
    0% { transform: translateY(0) rotateX(0deg) rotateY(0deg); }
    50% { transform: translateY(-150px) rotateX(1080deg) rotateY(1800deg); }
    100% { transform: translateY(0) rotateX(1440deg) rotateY(2160deg); }
  }
  .fly-rotate {
    animation: flyAndRotate 1.2s ease forwards;
  }

  button {
    padding: 12px 25px;
    font-size: 1.2em;
    cursor: pointer;
    border: none;
    background: #4CAF50;
    color: #fff;
    border-radius: 8px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.2);
  }
  button:hover {
    background: #45a049;
  }
  .result {
    margin-top: 20px;
    font-size: 1.5em;
    color: #fff;
  }
</style>
</head>
<body>

<div class="balance" id="balanceDisplay">Баланс: 0 ₽</div>

<div class="dice-container">
  <div class="scene">
    <div class="cube" id="cube1">
      <div class="face front"></div>
      <div class="face back"></div>
      <div class="face right"></div>
      <div class="face left"></div>
      <div class="face top"></div>
      <div class="face bottom"></div>
    </div>
  </div>
  <div class="scene">
    <div class="cube" id="cube2">
      <div class="face front"></div>
      <div class="face back"></div>
      <div class="face right"></div>
      <div class="face left"></div>
      <div class="face top"></div>
      <div class="face bottom"></div>
    </div>
  </div>
</div>

<button id="rollBtn">Подбросить</button>
<div class="result" id="result">Общая сумма: 0</div>

<script>
// Блокировка Ctrl+колесика
document.addEventListener("wheel", e => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });

// Объявление переменных
const cube1 = document.querySelector('#cube1');
const cube2 = document.querySelector('#cube2');
const resultEl = document.getElementById('result');
const btn = document.getElementById('rollBtn');
const balanceDisplay = document.getElementById('balanceDisplay');

// Звук анимации кубика
const diceSound = new Audio('https://github.com/SaweNap/dfkgdkfhgdkfgkubiki/raw/main/кубик.mp3');

// Массив точек для сторон кубика
const sidesPoints = {
  1: [[0,0]],
  2: [[-0.6,0.6], [0.6,-0.6]],
  3: [[-0.6,0.6], [0,0], [0.6,-0.6]],
  4: [[-0.6,0.6], [-0.6,-0.6], [0.6,0.6], [0.6,-0.6]],
  5: [[-0.6,0.6], [-0.6,-0.6], [0,0], [0.6,0.6], [0.6,-0.6]],
  6: [[-0.6,0.6], [-0.6,0], [-0.6,-0.6], [0.6,0.6], [0.6,0], [0.6,-0.6]],
};

// Функция для генерации случайного числа 1-6
function getRandomNumber() {
  return Math.ceil(Math.random() * 6);
}

// Функция для установки точек на лицах кубика
function setFacePoints(cubeId, faceClass, number) {
  const face = document.querySelector(`#${cubeId} .${faceClass}`);
  face.innerHTML = '';
  if (number === 0) return;
  const points = sidesPoints[number];
  const dotSize = 8;
  const offset = 30;
  points.forEach(coord => {
    const dot = document.createElement('div');
    dot.style.width = `${dotSize}px`;
    dot.style.height = `${dotSize}px`;
    dot.style.backgroundColor = 'black';
    dot.style.borderRadius = '50%';
    dot.style.position = 'absolute';
    dot.style.left = `calc(50% + ${coord[0] * offset}px - ${dotSize/2}px)`;
    dot.style.top = `calc(50% + ${coord[1] * offset}px - ${dotSize/2}px)`;
    face.appendChild(dot);
  });
}

// Функция для броска кубиков с анимацией и звуком
function throwCubes() {
  // Воспроизведение звука
  diceSound.currentTime = 0;
  diceSound.play().catch(e => { console.log('Ошибка воспроизведения звука', e); });
  
  // Очистка и подготовка кубиков
  [cube1, cube2].forEach(cube => {
    cube.style.transition = 'none';
    cube.classList.remove('fly-rotate');
    setFacePoints(cube.id, 'front', 0);
    cube.style.backgroundColor = '#fff';
  });
  // Запуск анимации
  [cube1, cube2].forEach(cube => {
    setTimeout(() => {
      cube.classList.add('fly-rotate');
    }, 50);
  });
  // В середине анимации
  setTimeout(() => {
    const num1 = getRandomNumber();
    const num2 = getRandomNumber();
    setFacePoints('cube1', 'front', num1);
    setFacePoints('cube2', 'front', num2);
    document.getElementById('result').textContent = 'Общая сумма: ' + (num1 + num2);
  }, 600);
}

// Изначально кубики и сумма
setTimeout(() => {
  setFacePoints('cube1', 'front', 0);
  setFacePoints('cube2', 'front', 0);
  document.getElementById('result').textContent = 'Общая сумма: 0';
}, 100);

// Обновление баланса
function updateBalanceDisplay(balance) {
  document.getElementById('balanceDisplay').innerText = 'Баланс: ' + balance + ' ₽';
}

// Получение и установка баланса из URL и JSON
(function() {
  const urlParams = new URLSearchParams(window.location.search);
  const userId = urlParams.get('id');
  if (userId) {
    fetch('https://raw.githubusercontent.com/SaweNap/dfjghdfifgJSON/main/users.json')
      .then(res => res.ok ? res.json() : Promise.reject())
      .then(users => {
        const user = users.find(u => u.id.toString()===userId.toString());
        if (user) {
          updateBalanceDisplay(user.balance || 0);
        } else {
          updateBalanceDisplay(0);
        }
      })
      .catch(() => { updateBalanceDisplay(0); });
  } else {
    updateBalanceDisplay(0);
  }
})();

// Обработчик кнопки
document.getElementById('rollBtn').addEventListener('click', throwCubes);
</script>
</body>
</html>
