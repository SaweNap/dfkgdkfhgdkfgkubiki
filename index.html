<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Реалистичные 3D кубики с вращением и полетом</title>
<style>
  body {
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: start;
    height: 100vh;
    margin: 0;
    padding-top: 20px;
    font-family: Arial, sans-serif;
    color: #fff;
  }
  #balanceContainer {
    font-size: 1.5em;
    margin-bottom: 10px;
  }
  #betSection {
    margin-bottom: 20px;
  }
  #betSection input {
    padding: 8px;
    font-size: 1.2em;
    width: 150px;
    border-radius: 5px;
    border: none;
  }
  #betSection button {
    padding: 10px 20px;
    font-size: 1.2em;
    margin-left: 10px;
    border: none;
    border-radius: 5px;
    background-color: #4CAF50;
    color: #fff;
    cursor: pointer;
  }
  #betSection button:hover {
    background-color: #45a049;
  }
  .dice-container {
    display: flex;
    gap: 20px;
    margin-bottom: 20px;
  }
  .scene {
    width: 100px;
    height: 100px;
    perspective: 1500px;
  }
  .cube {
    width: 100px;
    height: 100px;
    position: relative;
    transform-style: preserve-3d;
  }
  .face {
    position: absolute;
    width: 100px;
    height: 100px;
    background: #fff;
    border: 2px solid #555;
    border-radius: 8px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 1.5em;
    font-weight: bold;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
  }
  .front  { transform: rotateY(0deg) translateZ(50px); }
  .back   { transform: rotateY(180deg) translateZ(50px); }
  .right  { transform: rotateY(90deg) translateZ(50px); }
  .left   { transform: rotateY(-90deg) translateZ(50px); }
  .top    { transform: rotateX(90deg) translateZ(50px); }
  .bottom { transform: rotateX(-90deg) translateZ(50px); }

  @keyframes flyAndRotate {
    0% { transform: translateY(0) rotateX(0deg) rotateY(0deg); }
    50% { transform: translateY(-150px) rotateX(1080deg) rotateY(1800deg); }
    100% { transform: translateY(0) rotateX(1440deg) rotateY(2160deg); }
  }
  .fly-rotate {
    animation: flyAndRotate 1.2s ease forwards;
  }
  button {
    padding: 12px 25px;
    font-size: 1.2em;
    cursor: pointer;
    border: none;
    background: #4CAF50;
    color: #fff;
    border-radius: 8px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.2);
  }
  button:hover {
    background: #45a049;
  }
  #result {
    font-size: 1.5em;
    margin-top: 10px;
    color: #fff;
  }
</style>
</head>
<body>

<div id="balanceContainer">Баланс: <span id="userBalance">0</span> ₽</div>

<div id="betSection">
  <input type="number" id="betAmount" placeholder="Сумма ставки" />
  <button id="placeBetBtn">Сделать ставку</button>
</div>

<div class="dice-container">
  <div class="scene">
    <div class="cube" id="cube1">
      <div class="face front"></div>
      <div class="face back"></div>
      <div class="face right"></div>
      <div class="face left"></div>
      <div class="face top"></div>
      <div class="face bottom"></div>
    </div>
  </div>
  <div class="scene">
    <div class="cube" id="cube2">
      <div class="face front"></div>
      <div class="face back"></div>
      <div class="face right"></div>
      <div class="face left"></div>
      <div class="face top"></div>
      <div class="face bottom"></div>
    </div>
  </div>
</div>

<button id="rollBtn">Подбросить</button>
<div id="result">Общая сумма: 0</div>

<script>
const userId = new URLSearchParams(window.location.search).get('id');
let userBalance = 0;

// Загрузить баланс
if (userId) {
  fetch('https://raw.githubusercontent.com/SaweNap/dfjghdfifgJSON/main/users.json')
    .then(res => res.ok ? res.json() : Promise.reject())
    .then(users => {
      const user = users.find(u => u.id.toString() === userId);
      if (user) {
        userBalance = user.balance || 0;
        document.getElementById('userBalance').textContent = userBalance;
      } else {
        alert('Пользователь не найден');
      }
    })
    .catch(() => alert('Ошибка загрузки данных'));
} else {
  alert('Пользователь не найден');
}

// Обработка ставки
const placeBetBtn = document.getElementById('placeBetBtn');
const betInput = document.getElementById('betAmount');
const resultDiv = document.getElementById('result');

let currentBet = 0;

document.getElementById('rollBtn').onclick = () => {
  const bet = parseFloat(betInput.value);
  if (isNaN(bet) || bet <= 0) {
    alert('Введите корректную сумму ставки');
    return;
  }
  if (bet > userBalance) {
    alert('Недостаточно средств');
    return;
  }
  currentBet = bet;

  // Запускаем игру и получаем результат
  const result1 = Math.ceil(Math.random() * 6);
  const result2 = Math.ceil(Math.random() * 6);
  const sum = result1 + result2;

  // Простая логика выигрыша: если сумма 7, выигрыш
  let win = false;
  if (sum === 7) {
    win = true;
    userBalance += bet; // прибавляем выигрыш
  } else {
    userBalance -= bet; // проигрыш
  }
  document.getElementById('userBalance').textContent = userBalance;

  // Обновляем баланс в JSON-файле (пример)
  // Для реальной работы нужен сервер
  fetch('https://raw.githubusercontent.com/SaweNap/dfjghdfifgJSON/main/users.json')
    .then(res => res.ok ? res.json() : Promise.reject())
    .then(users => {
      const userIndex = users.findIndex(u => u.id.toString() === userId);
      if (userIndex !== -1) {
        users[userIndex].balance = userBalance;
        // Обновление файла через API или сервер — нужно реализовать
        // Для примера просто логируем
        console.log('Обновленный список пользователей:', users);
        // Тут обычно отправка PATCH/PUT-запрос на сервер
      }
    });

  // Анимация кубиков
  const cube1 = document.querySelector('#cube1');
  const cube2 = document.querySelector('#cube2');

  const sidesPoints = {
    1: [[0,0]],
    2: [[-0.6,0.6], [0.6,-0.6]],
    3: [[-0.6,0.6], [0,0], [0.6,-0.6]],
    4: [[-0.6,0.6], [-0.6,-0.6], [0.6,0.6], [0.6,-0.6]],
    5: [[-0.6,0.6], [-0.6,-0.6], [0,0], [0.6,0.6], [0.6,-0.6]],
    6: [[-0.6,0.6], [-0.6,0], [-0.6,-0.6], [0.6,0.6], [0.6,0], [0.6,-0.6]],
  };

  function setFace(cubeId, number) {
    const face = document.querySelector(`#${cubeId} .front`);
    face.innerHTML = '';
    if (number === 0) return;
    const points = sidesPoints[number];
    const dotSize = 8;
    const offset = 30;
    points.forEach(coord => {
      const dot = document.createElement('div');
      dot.style.width = `${dotSize}px`;
      dot.style.height = `${dotSize}px`;
      dot.style.backgroundColor = 'black';
      dot.style.borderRadius = '50%';
      dot.style.position = 'absolute';
      dot.style.left = `calc(50% + ${coord[0] * offset}px - ${dotSize/2}px)`;
      dot.style.top = `calc(50% + ${coord[1] * offset}px - ${dotSize/2}px)`;
      face.appendChild(dot);
    });
  }

  // Анимация
  [cube1, cube2].forEach(cube => {
    cube.style.transition = 'none';
    cube.classList.remove('fly-rotate');
    setFace(cube.id, 0);
  });
  [cube1, cube2].forEach(cube => {
    setTimeout(() => {
      cube.classList.add('fly-rotate');
    }, 50);
  });
  setTimeout(() => {
    setFace('cube1', result1);
    setFace('cube2', result2);
    document.getElementById('result').textContent = 'Общая сумма: ' + sum;
  }, 600);
};
</script>
</body>
</html>
