<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Игры: Баланс и Молния + Кубики</title>
<style>
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    color: #fff;
    margin: 0;
    padding: 20px;
  }
  .balance {
    font-size: 1.5em;
    margin-bottom: 10px;
    text-shadow: 1px 1px 2px #000;
    text-align: center;
  }
  h1 {
    margin-bottom: 10px;
    font-size: 2em;
    text-align: center;
    text-shadow: 1px 1px 3px #000;
  }
  /* Общие стили для блока с кубиками */
  .dice-container {
    display: flex;
    gap: 20px;
    margin-bottom: 20px;
    justify-content: center;
  }
  .scene {
    width: 100px;
    height: 100px;
    perspective: 1500px;
  }
  .cube {
    width: 100px;
    height: 100px;
    position: relative;
    transform-style: preserve-3d;
  }
  .face {
    position: absolute;
    width: 100px;
    height: 100px;
    background: #fff;
    border: 2px solid #555;
    border-radius: 8px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 1.5em;
    font-weight: bold;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
    color: black;
  }
  .front  { transform: rotateY(0deg) translateZ(50px); }
  .back   { transform: rotateY(180deg) translateZ(50px); }
  .right  { transform: rotateY(90deg) translateZ(50px); }
  .left   { transform: rotateY(-90deg) translateZ(50px); }
  .top    { transform: rotateX(90deg) translateZ(50px); }
  .bottom { transform: rotateX(-90deg) translateZ(50px); }

  @keyframes flyAndRotate {
    0% { transform: translateY(0) rotateX(0deg) rotateY(0deg); }
    50% { transform: translateY(-150px) rotateX(1080deg) rotateY(1800deg); }
    100% { transform: translateY(0) rotateX(1440deg) rotateY(2160deg); }
  }
  .fly-rotate {
    animation: flyAndRotate 1.2s ease forwards;
  }
  
  /* Стиль для современных кнопок */
  button {
    padding: 12px 25px;
    font-size: 1.2em;
    cursor: pointer;
    border: none;
    border-radius: 12px;
    background: linear-gradient(45deg, #6a11cb, #2575fc);
    color: #fff;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    transition: all 0.3s ease;
    position: relative;
    z-index: 999;
  }
  button:hover {
    background: linear-gradient(45deg, #2575fc, #6a11cb);
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(0,0,0,0.4);
  }
  button:active {
    transform: translateY(0);
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }

  #result {
    margin-top: 20px;
    font-size: 1.5em;
    text-align: center;
  }
  /* Ввод ставки и числа */
  #bet-input, #number-input {
    display: block;
    margin: 10px auto;
    padding: 12px 20px;
    font-size: 1.2em;
    border-radius: 20px;
    border: none;
    outline: none;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    width: 200px;
  }
  /* Контейнер для кнопки "Начать игру" справа */
  #startBtnContainer {
    display: flex;
    justify-content: flex-end;
    margin-top: 10px;
    position: relative;
    z-index: 999; /* чтобы точно было сверху */
  }
  #start-game-btn {
    padding: 12px 25px;
    font-size: 1.2em;
    cursor: pointer;
    border: none;
    border-radius: 12px;
    background: linear-gradient(45deg, #6a11cb, #2575fc);
    color: #fff;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    transition: all 0.3s ease;
    position: relative;
    z-index: 999;
  }
  /* Стиль для кнопки "Играть снова" */
  #playAgainBtn {
    display: none;
    margin: 20px auto;
    padding: 12px 25px;
    font-size: 1.2em;
    cursor: pointer;
    border: none;
    border-radius: 12px;
    background: linear-gradient(45deg, #6a11cb, #2575fc);
    color: #fff;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  }
  #playAgainBtn:hover {
    background: linear-gradient(45deg, #2575fc, #6a11cb);
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(0,0,0,0.4);
  }
</style>
</head>
<body>

<!-- Поверхностное сообщение -->
<div id="overlayMessage"></div>

<!-- Аудио для кубика -->
<audio id="diceSound" src="https://github.com/SaweNap/dfkgdkfhgdkfgkubiki/blob/main/кубик.mp3" preload="auto"></audio>

<div class="balance" id="balanceDisplay">Баланс: 0 ₽</div>
<!-- Поля для ставки и числа -->
<input type="number" id="bet-input" placeholder="Введите ставку" min="1" />
<input type="number" id="number-input" placeholder="От 1 до 12" min="1" max="12" />

<!-- Контейнер для кнопки "Начать игру" справа -->
<div id="startBtnContainer">
  <button id="start-game-btn">Начать игру</button>
</div>

<div id="message"></div>

<div class="dice-container">
  <div class="scene">
    <div class="cube" id="cube1">
      <div class="face front"></div>
      <div class="face back"></div>
      <div class="face right"></div>
      <div class="face left"></div>
      <div class="face top"></div>
      <div class="face bottom"></div>
    </div>
  </div>
  <div class="scene">
    <div class="cube" id="cube2">
      <div class="face front"></div>
      <div class="face back"></div>
      <div class="face right"></div>
      <div class="face left"></div>
      <div class="face top"></div>
      <div class="face bottom"></div>
    </div>
  </div>
</div>
<div class="result" id="result">Общая сумма: 0</div>
<!-- Кнопка "Играть снова" -->
<button id="playAgainBtn">Играть снова</button>

<script>
const GITHUB_TOKEN = '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'; // вставьте свой токен
const GITHUB_REPO = 'SaweNap/dfjghdfifgJSON';
const FILE_PATH = 'users.json';

const balanceDisplay = document.getElementById('balanceDisplay');
const betInput = document.getElementById('bet-input');
const numberInput = document.getElementById('number-input');

const startGameBtn = document.getElementById('start-game-btn');
const playAgainBtn = document.getElementById('playAgainBtn');

const cube1 = document.querySelector('#cube1');
const cube2 = document.querySelector('#cube2');

let currentUser = { id: 'test', balance: 0 };
let userId = null;
let users = [];
let gameInProgress = false;

// Загрузка баланса и остальные функции (загружаем и сохраняем баланс, обновляем UI, и т.д.)
async function loadUserBalance() {
  const url = `https://raw.githubusercontent.com/${GITHUB_REPO}/main/${FILE_PATH}`;
  const response = await fetch(url);
  if (response.ok) {
    users = await response.json();
    const user = users.find(u => u.id.toString() === userId.toString());
    if (user) {
      currentUser.balance = user.balance || 0;
    } else {
      currentUser.balance = 0;
    }
  } else {
    currentUser.balance = 0;
  }
  updateBalanceDisplay();
}
async function saveUserBalance() {
  const idx = users.findIndex(u => u.id.toString() === userId.toString());
  if (idx >= 0) {
    users[idx].balance = currentUser.balance;
  } else {
    users.push({ id: userId, balance: currentUser.balance });
  }
  await updateUsersOnGitHub();
}

// Инициализация
(async () => {
  const params = new URLSearchParams(window.location.search);
  userId = params.get('id') || 'test';
  await loadUserBalance();
})();

function updateBalanceDisplay() {
  document.getElementById('balanceDisplay').textContent = 'Баланс: ' + currentUser.balance + ' ₽';
}

function showOverlayMessage(text) {
  const overlay = document.getElementById('overlayMessage');
  overlay.innerHTML = text;
  overlay.style.display = 'flex';
  setTimeout(() => {
    overlay.style.display = 'none';
  }, 2000);
}

// Функции для кубиков
function throwCubes() {
  const sound = document.getElementById('diceSound');
  if (sound) {
    sound.currentTime = 0;
    sound.play().catch(e => {});
  }
  [cube1, cube2].forEach(cube => {
    cube.style.transition = 'none';
    cube.classList.remove('fly-rotate');
    setFacePoints(cube.id, 'front', 0);
  });
  setTimeout(() => {
    [cube1, cube2].forEach(cube => {
      cube.classList.add('fly-rotate');
    });
  }, 50);
}

function setFacePoints(cubeId, faceClass, number) {
  const face = document.querySelector(`#${cubeId} .${faceClass}`);
  face.innerHTML = '';
  if (number === 0) return;
  const points = sidesPoints[number];
  const dotSize = 8;
  const offset = 30;
  points.forEach(coord => {
    const dot = document.createElement('div');
    dot.style.width = `${dotSize}px`;
    dot.style.height = `${dotSize}px`;
    dot.style.backgroundColor = 'black';
    dot.style.borderRadius = '50%';
    dot.style.position = 'absolute';
    dot.style.left = `calc(50% + ${coord[0] * offset}px - ${dotSize/2}px)`;
    dot.style.top = `calc(50% + ${coord[1] * offset}px - ${dotSize/2}px)`;
    face.appendChild(dot);
  });
}

// Массив точек для граней кубика
const sidesPoints = {
  1: [[0,0]],
  2: [[-0.6,0.6], [0.6,-0.6]],
  3: [[-0.6,0.6], [0,0], [0.6,-0.6]],
  4: [[-0.6,0.6], [-0.6,-0.6], [0.6,0.6], [0.6,-0.6]],
  5: [[-0.6,0.6], [-0.6,-0.6], [0,0], [0.6,0.6], [0.6,-0.6]],
  6: [[-0.6,0.6], [-0.6,0], [-0.6,-0.6], [0.6,0.6], [0.6,0], [0.6,-0.6]],
};

// Изначально кубики показывают пусто
setTimeout(() => {
  setFacePoints('cube1', 'front', 0);
  setFacePoints('cube2', 'front', 0);
  document.getElementById('result').textContent = 'Общая сумма: 0';
}, 100);

// Обработка кнопки "Начать игру"
document.getElementById('start-game-btn').onclick = () => {
  if (gameInProgress) return; // блокируем повторный запуск
  const bet = parseFloat(betInput.value);
  const guessNumber = parseInt(numberInput.value);
  if (isNaN(bet) || bet <= 0) {
    showOverlayMessage('Введите корректную ставку');
    return;
  }
  if (isNaN(guessNumber) || guessNumber < 1 || guessNumber > 12) {
    showOverlayMessage('Введите число от 1 до 12');
    return;
  }
  if (currentUser.balance < bet) {
    showOverlayMessage('Баланс недостаточен!');
    return;
  }
  startGame(bet, guessNumber);
};

async function startGame(bet, guessNumber) {
  if (gameInProgress) return;
  gameInProgress = true; // блокируем повторный запуск
  document.getElementById('result').textContent = '';

  throwCubes();

  setTimeout(async () => {
    const sum = Math.ceil(Math.random() * 6) + Math.ceil(Math.random() * 6);
    setFacePoints('cube1', 'front', Math.ceil(Math.random() * 6));
    setFacePoints('cube2', 'front', Math.ceil(Math.random() * 6));
    document.getElementById('result').textContent = 'Общая сумма: ' + sum;

    if (sum === guessNumber) {
      currentUser.balance += bet * 3;
      document.getElementById('result').textContent += ' — Вы выиграли!';
    } else {
      currentUser.balance -= bet;
      if (currentUser.balance < 0) currentUser.balance = 0;
      document.getElementById('result').textContent += ' — Не угадали!';
    }
    updateBalanceDisplay();
    await saveUserBalance();
    showPlayAgainButton();
  }, 1500);
}

function showPlayAgainButton() {
  document.getElementById('playAgainBtn').style.display = 'block';
}

// Обработчик "Играть снова"
document.getElementById('playAgainBtn').onclick = () => {
  document.getElementById('result').textContent = 'Общая сумма: 0';
  document.getElementById('playAgainBtn').style.display = 'none';
  // Разрешаем запуск новой игры
  gameInProgress = false;
  // Сброс кубиков
  setTimeout(() => {
    setFacePoints('cube1', 'front', 0);
    setFacePoints('cube2', 'front', 0);
  }, 100);
};
</script>
</body>
</html>
