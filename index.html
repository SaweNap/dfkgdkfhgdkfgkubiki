<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Реалистичные 3D кубики с вращением и полетом</title>
<style>
  body {
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    font-family: Arial, sans-serif;
    color: #fff;
  }
  .balance {
    font-size: 1.5em;
    margin-bottom: 20px;
    text-shadow: 1px 1px 2px #000;
  }
  .dice-container {
    display: flex;
    gap: 20px;
    margin-bottom: 20px;
  }
  .scene {
    width: 100px;
    height: 100px;
    perspective: 1500px;
  }
  .cube {
    width: 100px;
    height: 100px;
    position: relative;
    transform-style: preserve-3d;
  }
  .face {
    position: absolute;
    width: 100px;
    height: 100px;
    background: #fff;
    border: 2px solid #555;
    border-radius: 8px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 1.5em;
    font-weight: bold;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
  }
  .front  { transform: rotateY(0deg) translateZ(50px); }
  .back   { transform: rotateY(180deg) translateZ(50px); }
  .right  { transform: rotateY(90deg) translateZ(50px); }
  .left   { transform: rotateY(-90deg); }
  .top    { transform: rotateX(90deg) translateZ(50px); }
  .bottom { transform: rotateX(-90deg); }

  @keyframes flyAndRotate {
    0% { transform: translateY(0) rotateX(0deg) rotateY(0deg); }
    50% { transform: translateY(-150px) rotateX(1080deg) rotateY(1800deg); }
    100% { transform: translateY(0) rotateX(1440deg) rotateY(2160deg); }
  }
  .fly-rotate {
    animation: flyAndRotate 1.2s ease forwards;
  }

  button {
    padding: 12px 25px;
    font-size: 1.2em;
    cursor: pointer;
    border: none;
    background: #4CAF50;
    color: #fff;
    border-radius: 8px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    margin: 10px;
  }
  button:disabled {
    background: #888;
    cursor: not-allowed;
  }
  #betSection {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.8);
    padding: 20px;
    border-radius: 10px;
    z-index: 9999;
  }
  #betSection input, #betSection select {
    font-size: 1.2em;
    margin: 5px 0;
  }
</style>
</head>
<body>

<div class="balance" id="balanceDisplay">Баланс: 0 ₽</div>

<div class="dice-container">
  <div class="scene">
    <div class="cube" id="cube1">
      <div class="face front"></div>
      <div class="face back"></div>
      <div class="face right"></div>
      <div class="face left"></div>
      <div class="face top"></div>
      <div class="face bottom"></div>
    </div>
  </div>
  <div class="scene">
    <div class="cube" id="cube2">
      <div class="face front"></div>
      <div class="face back"></div>
      <div class="face right"></div>
      <div class="face left"></div>
      <div class="face top"></div>
      <div class="face bottom"></div>
    </div>
  </div>
</div>

<button id="rollBtn">Подбросить</button>
<div id="result">Общая сумма: 0</div>

<!-- Меню для ставки -->
<div id="betSection">
  <div>Введите сумму ставки: <input type="number" id="betAmount" min="1" value="30"></div>
  <div>Выберите число (1-12): 
    <select id="betNumber"></select>
  </div>
  <button id="placeBetBtn">Поставить ставку</button>
  <button id="cancelBetBtn">Отмена</button>
</div>

<script>
// Блокировка Ctrl+колесика
document.addEventListener("wheel", e => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });

// Переменные
const cube1 = document.querySelector('#cube1');
const cube2 = document.querySelector('#cube2');
const resultEl = document.getElementById('result');
const rollBtn = document.getElementById('rollBtn');
const balanceEl = document.getElementById('balanceDisplay');
const betSection = document.getElementById('betSection');
const betAmountInput = document.getElementById('betAmount');
const betNumberSelect = document.getElementById('betNumber');
const placeBetBtn = document.getElementById('placeBetBtn');
const cancelBetBtn = document.getElementById('cancelBetBtn');

let userBalance = 100; // пример баланса
let currentUser = { id: '1', balance: 100 }; // пример текущего пользователя
let users = [];
// Заполняем список чисел
for (let i=1; i<=12; i++) {
  const opt = document.createElement('option');
  opt.value = i;
  opt.innerText = i;
  betNumberSelect.appendChild(opt);
}

// Обработка кнопки "Подбросить"
document.getElementById('rollBtn').addEventListener('click', () => {
  if (!currentUser) {
    alert('Пользователь не найден. Перезагрузите страницу.');
    return;
  }
  if (userBalance <= 0) {
    alert('Баланс равен 0. Пополните баланс.');
    return;
  }
  showBetMenu();
});

function showBetMenu() {
  document.getElementById('betSection').style.display = 'block';
}

// Обработка ставки
placeBetBtn.onclick = async () => {
  const betSum = parseInt(betAmountInput.value);
  const chosenNumber = parseInt(betNumberSelect.value);
  if (isNaN(betSum) || betSum < 1 || betSum > userBalance) {
    alert('Некорректная сумма ставки или недостаточно средств.');
    return;
  }
  // списываем сумму
  userBalance -= betSum;
  // закрываем меню
  document.getElementById('betSection').style.display = 'none';

  // запускаем анимацию кубиков
  await startDiceAnimation();

  // после анимации показываем результат
  const roll1 = getRandomNumber();
  const roll2 = getRandomNumber();

  document.getElementById('result').innerText = 'Общая сумма: ' + (roll1 + roll2);
  alert('Выпало: ' + roll1 + ' и ' + roll2);

  if (roll1 === chosenNumber || roll2 === chosenNumber) {
    const winnings = betSum * 3;
    userBalance += winnings;
    alert('Поздравляем! Вы выиграли ' + winnings + ' ₽');
  } else {
    alert('Пробуйте еще!');
  }
  // Обновление баланса
  // Тут вставьте логику обновления баланса текущего пользователя
  // например, currentUser.balance = userBalance;
  // и сохранение данных

  // Обновляем вывод баланса
  // updateBalance();
};

cancelBetBtn.onclick = () => {
  document.getElementById('betSection').style.display = 'none';
};

// Функция запуска анимации кубиков
async function startDiceAnimation() {
  return new Promise(resolve => {
    document.querySelectorAll('.cube').forEach(cube => cube.classList.add('fly-rotate'));
    setTimeout(() => {
      document.querySelectorAll('.cube').forEach(cube => cube.classList.remove('fly-rotate'));
      resolve();
    }, 1200);
  });
}

// Изначально установка лиц кубиков
setTimeout(() => {
  setFacePoints('cube1', 'front', 0);
  setFacePoints('cube2', 'front', 0);
  document.getElementById('result').innerText = 'Общая сумма: 0';
}, 100);

// Функция для отображения точек на лицах кубика
function setFacePoints(cubeId, faceClass, number) {
  const face = document.querySelector(`#${cubeId} .${faceClass}`);
  face.innerHTML = '';
  // сюда добавьте код для отображения точек
}

// Ваша функция для рандомных чисел
function getRandomNumber() {
  return Math.ceil(Math.random() * 6);
}
</script>
</body>
</html>
