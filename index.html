<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Реалистичные 3D кубики с вращением и полетом</title>
<style>
  body {
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: start;
    height: 100vh;
    margin: 0;
    padding-top: 20px;
    font-family: Arial, sans-serif;
    color: #fff;
  }
  #balanceContainer {
    font-size: 1.5em;
    margin-bottom: 10px;
  }
  #betSection {
    margin-bottom: 10px;
    display: flex;
    gap: 10px;
    align-items: center;
  }
  #betSection input {
    padding: 8px;
    font-size: 1.2em;
    width: 150px;
    border-radius: 5px;
    border: none;
  }
  #betSection button {
    padding: 10px 20px;
    font-size: 1.2em;
    border: none;
    border-radius: 5px;
    background-color: #4CAF50;
    color: #fff;
    cursor: pointer;
  }
  #betSection button:hover {
    background-color: #45a049;
  }
  /* Ввод числа для ставки на число */
  #numberBetContainer {
    margin-bottom: 20px;
    display: flex;
    gap: 10px;
    align-items: center;
  }
  #numberBetContainer input {
    padding: 8px;
    font-size: 1.2em;
    width: 150px;
    border-radius: 5px;
    border: none;
  }
  #numberBetContainer select {
    padding: 8px;
    font-size: 1.2em;
    border-radius: 5px;
    border: none;
  }
  /* Кубики */
  .dice-container {
    display: flex;
    gap: 20px;
    margin-bottom: 20px;
  }
  .scene {
    width: 100px;
    height: 100px;
    perspective: 1500px;
  }
  .cube {
    width: 100px;
    height: 100px;
    position: relative;
    transform-style: preserve-3d;
  }
  .face {
    position: absolute;
    width: 100px;
    height: 100px;
    background: #fff;
    border: 2px solid #555;
    border-radius: 8px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 1.5em;
    font-weight: bold;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
    position: relative;
  }
  .front  { transform: rotateY(0deg) translateZ(50px); }
  .back   { transform: rotateY(180deg) translateZ(50px); }
  .right  { transform: rotateY(90deg) translateZ(50px); }
  .left   { transform: rotateY(-90deg) translateZ(50px); }
  .top    { transform: rotateX(90deg) translateZ(50px); }
  .bottom { transform: rotateX(-90deg) translateZ(50px); }

  @keyframes flyAndRotate {
    0% { transform: translateY(0) rotateX(0deg) rotateY(0deg); }
    50% { transform: translateY(-150px) rotateX(1080deg) rotateY(1800deg); }
    100% { transform: translateY(0) rotateX(1440deg) rotateY(2160deg); }
  }
  .fly-rotate {
    animation: flyAndRotate 1.2s ease forwards;
  }
  button {
    padding: 12px 25px;
    font-size: 1.2em;
    cursor: pointer;
    border: none;
    background: #4CAF50;
    color: #fff;
    border-radius: 8px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.2);
  }
  button:hover {
    background: #45a049;
  }
  #result {
    font-size: 1.5em;
    margin-top: 10px;
  }
</style>
</head>
<body>

<div id="balanceContainer">Баланс: <span id="userBalance">0</span> ₽</div>

<!-- Ввод ставки -->
<div id="betSection">
  <input type="number" id="betAmount" placeholder="Сумма ставки" />
  <button id="placeBetBtn">Сделать ставку</button>
</div>

<!-- Ввод на какое число ставлю -->
<div id="numberBetContainer">
  <input type="number" id="numberBet" placeholder="На число 1-6" min="1" max="6" />
  <button id="placeNumberBetBtn">Сделать ставку на число</button>
</div>

<!-- Кубики -->
<div class="dice-container">
  <div class="scene">
    <div class="cube" id="cube1">
      <div class="face front"></div>
      <div class="face back"></div>
      <div class="face right"></div>
      <div class="face left"></div>
      <div class="face top"></div>
      <div class="face bottom"></div>
    </div>
  </div>
  <div class="scene">
    <div class="cube" id="cube2">
      <div class="face front"></div>
      <div class="face back"></div>
      <div class="face right"></div>
      <div class="face left"></div>
      <div class="face top"></div>
      <div class="face bottom"></div>
    </div>
  </div>
</div>

<button id="rollBtn">Подбросить</button>
<div id="result">Общая сумма: 0</div>

<!-- Звук кубика -->
<audio id="diceSound" src="https://raw.githubusercontent.com/SaweNap/dfkgdkfhgdkfgkubiki/main/кубик.mp3" preload="auto"></audio>

<script>
const userId = new URLSearchParams(window.location.search).get('id');
let userBalance = 0;

// Загрузка баланса
if (userId) {
  fetch('https://raw.githubusercontent.com/SaweNap/dfjghdfifgJSON/main/users.json')
    .then(res => res.ok ? res.json() : Promise.reject())
    .then(users => {
      const user = users.find(u => u.id.toString() === userId);
      if (user) {
        userBalance = user.balance || 0;
        document.getElementById('userBalance').textContent = userBalance;
      } else {
        alert('Пользователь не найден');
      }
    })
    .catch(() => alert('Ошибка загрузки данных'));
} else {
  alert('Пользователь не найден');
}

const rollBtn = document.getElementById('rollBtn');
const betInput = document.getElementById('betAmount');
const resultDiv = document.getElementById('result');
const numberBetInput = document.getElementById('numberBet');

let currentBet = 0;
let betNumber = 0; // число, на которое ставка сделана

// Обработка ставки на сумму
document.getElementById('placeBetBtn').onclick = () => {
  const bet = parseFloat(betInput.value);
  if (isNaN(bet) || bet <= 0) {
    alert('Введите корректную сумму ставки');
    return;
  }
  if (bet > userBalance) {
    alert('Недостаточно средств');
    return;
  }
  currentBet = bet;
  alert(`Сделана ставка ${bet}₽ на сумму`);
};

// Обработка ставки на число
document.getElementById('placeNumberBetBtn').onclick = () => {
  const num = parseInt(numberBetInput.value);
  if (isNaN(num) || num < 1 || num > 6) {
    alert('Введите число от 1 до 6');
    return;
  }
  betNumber = num;
  alert(`Сделана ставка ${currentBet}₽ на число ${betNumber}`);
};

// Основная логика броска
rollBtn.onclick = () => {
  if (currentBet <= 0) {
    alert('Сначала сделайте ставку');
    return;
  }
  // Воспроизведение звука
  const sound = document.getElementById('diceSound');
  if (sound) {
    sound.currentTime = 0;
    sound.play().catch(e => { console.error(e); });
  }
  // Бросаем кубики
  const cube1 = document.querySelector('#cube1');
  const cube2 = document.querySelector('#cube2');

  const sidesPoints = {
    1: [[0,0]],
    2: [[-0.6,0.6], [0.6,-0.6]],
    3: [[-0.6,0.6], [0,0], [0.6,-0.6]],
    4: [[-0.6,0.6], [-0.6,-0.6], [0.6,0.6], [0.6,-0.6]],
    5: [[-0.6,0.6], [-0.6,-0.6], [0,0], [0.6,0.6], [0.6,-0.6]],
    6: [[-0.6,0.6], [-0.6,0], [-0.6,-0.6], [0.6,0.6], [0.6,0], [0.6,-0.6]],
  };

  function setFace(cubeId, number) {
    const face = document.querySelector(`#${cubeId} .front`);
    face.innerHTML = '';
    if (number === 0) return;
    const points = sidesPoints[number];
    const dotSize = 8;
    const offset = 30;
    points.forEach(coord => {
      const dot = document.createElement('div');
      dot.style.width = `${dotSize}px`;
      dot.style.height = `${dotSize}px`;
      dot.style.backgroundColor = 'black';
      dot.style.borderRadius = '50%';
      dot.style.position = 'absolute';
      dot.style.left = `calc(50% + ${coord[0] * offset}px - ${dotSize/2}px)`;
      dot.style.top = `calc(50% + ${coord[1] * offset}px - ${dotSize/2}px)`;
      face.appendChild(dot);
    });
  }

  // Анимация кубиков
  [cube1, cube2].forEach(cube => {
    cube.style.transition = 'none';
    cube.classList.remove('fly-rotate');
    setFace(cube.id, 0);
  });
  [cube1, cube2].forEach(cube => {
    setTimeout(() => {
      cube.classList.add('fly-rotate');
    }, 50);
  });
  // После анимации выбрать числа
  setTimeout(() => {
    const num1 = Math.ceil(Math.random() * 6);
    const num2 = Math.ceil(Math.random() * 6);
    const sum = num1 + num2;

    setFace('cube1', num1);
    setFace('cube2', num2);
    document.getElementById('result').textContent = 'Общая сумма: ' + sum;

    // Проверка выигрыша
    let won = false;
    if (betNumber !== 0 && betNumber === num1 && betNumber === num2) {
      // ставка на число и оба кубика совпали
      won = true;
      userBalance += currentBet * 2; // например, удваиваем ставку
    } else if (betNumber !== 0 && (num1 === betNumber || num2 === betNumber)) {
      // хотя бы один кубик совпал
      won = true;
      userBalance += currentBet; // вернуть ставку
    } else if (sum === 7) {
      // или по сумме
      won = true;
      userBalance += currentBet * 1.5; // пример
    } else {
      // проигрыш
      userBalance -= currentBet;
    }
    // Обновляем баланс
    document.getElementById('userBalance').textContent = userBalance;

    // Обновляем в JSON - для примера показываю лог
    fetch('https://raw.githubusercontent.com/SaweNap/dfjghdfifgJSON/main/users.json')
      .then(res => res.ok ? res.json() : Promise.reject())
      .then(users => {
        const idx = users.findIndex(u => u.id.toString() === userId);
        if (idx !== -1) {
          users[idx].balance = userBalance;
          console.log('Обновленные данные:', users);
          // Тут нужно отправлять обновленные данные на сервер
        }
      });
  }, 600);
};
</script>
</body>
</html>
